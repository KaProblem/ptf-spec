name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tools/ptf-check.mjs examples/minimal-library
      - run: node tools/ptf-codetest.mjs examples/minimal-library/code/*/*/
      - name: MCP server tests
        run: |
          npm ci --prefix mcp
          npm test --prefix mcp
      - name: MCP server bundle is up to date
        run: |
          npm run build --prefix mcp
          git diff --exit-code -- mcp/dist
          PTF_MCP_ENTRY=$PWD/mcp/dist/ptf-mcp.mjs npm test --prefix mcp
      - name: Simulator self-test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tools/ptf-selftest.mjs examples/minimal-library/sims/*/*/
      - name: MCP App player in the browser
        run: NODE_PATH=$PWD/node_modules node mcp/test/player.browser.mjs
